"$schema" = "schemas/schema.json"

[default]
description = "Token, launch data, the push events (token, message, opened) and the background sync (no Firebase)."
permissions = [
  "allow-get-token",
  "allow-take-launch-data",
  "allow-register-listener",
  "allow-remove-listener",
  "allow-start-background-sync",
  "allow-stop-background-sync",
  "allow-background-sync-state",
  "allow-request-battery-exemption",
]
