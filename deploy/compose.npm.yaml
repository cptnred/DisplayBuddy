# Variante B: Display Buddy hinter einem bereits vorhandenen Reverse-Proxy
# (z. B. Nginx Proxy Manager), der Ports 80/443 belegt. Kein eigener Caddy, keine
# veröffentlichten Ports. In .env steht COMPOSE_FILE=compose.npm.yaml, dann gelten alle
# "docker compose"-Befehle der README unverändert:
#   docker compose up -d --build
# Proxy-Host: Forward Hostname "displaybuddy-buddy-1", Port 8080, Scheme http.

name: displaybuddy

services:
  buddy:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: displaybuddy/buddy-server:local
    restart: unless-stopped
    environment:
      BUDDY_PUBLIC_URL: https://${BUDDY_DOMAIN:?set BUDDY_DOMAIN in deploy/.env}
      BUDDY_LISTEN: 0.0.0.0:8080
      BUDDY_DB: /data/buddy.db
      BUDDY_BACKUP_DIR: /data/backups
      BUDDY_WEB_DIR: /app/web
      BUDDY_VAPID_PRIVATE_KEY_FILE: /data/vapid.pem
      BUDDY_VAPID_SUBJECT: ${BUDDY_VAPID_SUBJECT:?set BUDDY_VAPID_SUBJECT in deploy/.env}
      # Subnetz des Netzes "proxy" (dort liegt NPM), damit die Login-Bremse die echte Client-IP zählt.
      BUDDY_TRUSTED_PROXIES: ${PROXY_SUBNET:-172.18.0.0/16}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=warn}
      # Nur Android/FCM, optional (D-105): Dienstkonto-JSON ins Daten-Volume legen und in .env
      # BUDDY_FCM_SERVICE_ACCOUNT_FILE=/data/fcm-service-account.json setzen. Leer = kein nativer Push.
      BUDDY_FCM_SERVICE_ACCOUNT_FILE: ${BUDDY_FCM_SERVICE_ACCOUNT_FILE:-}
      BUDDY_FCM_PAYLOAD: ${BUDDY_FCM_PAYLOAD:-full}
      # v4-Konten (PLAN_V4 §11.2, server/src/config.rs). Werte in .env ändern, nicht hier.
      # Standard = Selbst-Hosting: Registrierung zu, keine Kontingente (leer = unbegrenzt).
      # buddy.pev-point.de setzt in seiner .env (docs/OPERATIONS.md):
      #   BUDDY_REGISTRATION=open          # erst, wenn Impressum + Datenschutz online sind
      #   BUDDY_QUOTA_BYTES=52428800
      #   BUDDY_QUOTA_NOTES=5000
      #   BUDDY_QUOTA_DEVICES=10
      #   BUDDY_IMPRINT_URL=https://…      # URLs stehen noch nicht fest (D-112)
      #   BUDDY_PRIVACY_URL=https://…
      #   BUDDY_OPERATOR_NAME=pev-point.de
      #   BUDDY_FCM_PAYLOAD=minimal
      BUDDY_REGISTRATION: ${BUDDY_REGISTRATION:-closed}
      BUDDY_REGISTRATION_POW_BITS: ${BUDDY_REGISTRATION_POW_BITS:-22}
      BUDDY_REGISTRATION_DAILY_LIMIT: ${BUDDY_REGISTRATION_DAILY_LIMIT:-200}
      BUDDY_QUOTA_BYTES: ${BUDDY_QUOTA_BYTES:-}
      BUDDY_QUOTA_NOTES: ${BUDDY_QUOTA_NOTES:-}
      BUDDY_QUOTA_DEVICES: ${BUDDY_QUOTA_DEVICES:-}
      BUDDY_IMPRINT_URL: ${BUDDY_IMPRINT_URL:-}
      BUDDY_PRIVACY_URL: ${BUDDY_PRIVACY_URL:-}
      BUDDY_TERMS_URL: ${BUDDY_TERMS_URL:-}
      BUDDY_OPERATOR_NAME: ${BUDDY_OPERATOR_NAME:-}
    volumes:
      - buddy-data:/data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy} # Docker-Netz, in dem auch der Reverse-Proxy hängt

volumes:
  buddy-data:
