[package]
name = "display-buddy"
version = "0.2.0"
description = "Display Buddy – animated always-on-top smiley with notes"
authors = ["Display Buddy"]
edition = "2024"

[lib]
name = "display_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
base64 = "0.22"
log = "0.4"
buddy-core = { path = "../crates/buddy-core" }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-log = "2.10.1"
# v3 sync client (D-51/D-52): only the re-exported reqwest is used, Rust-side (rustls + ring,
# builds with x86_64-pc-windows-gnu). The plugin itself is not registered (no JS fetch).
tauri-plugin-http = "=2.8.3"

# Windows: rewrite the autostart Run value with a quoted exe path (see src/autostart.rs).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Shutdown",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"
# v3: sync token in the Windows Credential Manager (D-53); no regex search needed.
keyring-core = "=1.0.1"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[features]
# Diagnostic build with a console window (all log output + panics visible):
#   npm run tauri build -- --target x86_64-pc-windows-gnu --no-bundle --features console
console = []

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
