[package]
name = "buddy-core"
version = "0.4.0"
description = "Display Buddy shared logic: models, reminder math (time-zone aware), LWW, clock"
edition = "2024"
publish = false

# No workspace on purpose (D-35): src-tauri, server and mobile/src-tauri use this crate via a path dependency.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
log = "0.4"
# v4: pairing/recovery code hashes and registration proof-of-work (same pins as the server, D-109).
sha2 = "=0.11.1"
base64 = "=0.23.1"

[dev-dependencies]
